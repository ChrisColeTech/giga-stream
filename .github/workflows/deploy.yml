# The giga-stream deploy: verify every program, then fire ONE Render deploy.
#
# The service runs both programs (scripts/start.sh): the fileserver public on
# $PORT and the admin backend as its loopback sibling. Render's autoDeploy is
# off on purpose — a deploy restarts both processes — so a push to main through
# this workflow is the only road to production. Everything must be green before
# the deploy trigger fires, and a failed trigger is visible here rather than silent.
#
# No root workspaces (docs/01): every program owns its package.json and
# lockfile, and CI installs exactly the programs each job needs — including
# the dependencies of anything a job typechecks or spawns:
#   • the admin and frontend programs INCLUDE the shared library sources in
#     their tsc projects (tsconfig paths @giga/ui and @giga/http), and those
#     sources resolve react/zod/lucide from src/shared/<pkg>/node_modules —
#     so those packages must be installed for the typecheck to see real types;
#   • the fileserver's tests spawn the REAL backend, whose test lane runs on
#     src/backend/node_modules/tsx — so that program is installed too.
#
# Required repository secrets, configured in GitHub Actions:
#   RENDER_API_KEY      — Account Settings → API Keys on Render
#   RENDER_SERVICE_ID   — the srv-… id of the giga-stream web service

name: deploy

on:
  push:
    branches: [main, turso-migration]
  workflow_dispatch:

concurrency:
  # Deploys mutate production: serialise, never cancel mid-deploy.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.11.1
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            src/admin/package-lock.json
            src/shared/ui/package-lock.json
            src/shared/http/package-lock.json
      - name: Install (admin + the shared sources it typechecks)
        run: |
          npm ci --no-audit --no-fund --prefix src/shared/ui
          npm ci --no-audit --no-fund --prefix src/shared/http
          npm ci --no-audit --no-fund --prefix src/admin
      - run: npm run typecheck
        working-directory: src/admin
      - run: npm test
        working-directory: src/admin

  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/shared/ui/package-lock.json
            src/shared/http/package-lock.json
      - name: Install (frontend + the shared sources it typechecks)
        run: |
          npm ci --no-audit --no-fund --prefix src/shared/ui
          npm ci --no-audit --no-fund --prefix src/shared/http
          npm ci --no-audit --no-fund --prefix src/frontend
      - run: npm run typecheck
        working-directory: src/frontend
      - run: npm test
        working-directory: src/frontend

  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/backend
      - run: npm run typecheck
        working-directory: src/backend
      - name: Verify the committed Linux FFmpeg payload
        run: bash scripts/ffmpeg/verify-ffmpeg-linux.sh
      - run: npm test
        working-directory: src/backend

  verify-fileserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            src/fileserver/package-lock.json
            src/backend/package-lock.json
      - name: Install (fileserver + the real backend its tests spawn)
        run: |
          npm ci --no-audit --no-fund --prefix src/backend
          npm ci --no-audit --no-fund --prefix src/fileserver
      - run: npm run typecheck
        working-directory: src/fileserver
      - run: npm test
        working-directory: src/fileserver

  verify-shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: src/shared/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/shared/ui
      - run: npm run typecheck
        working-directory: src/shared/ui
      - run: npm test
        working-directory: src/shared/ui

  verify-shared-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: src/shared/http/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/shared/http
      - run: npm run typecheck
        working-directory: src/shared/http
      - run: npm test
        working-directory: src/shared/http

  deploy:
    needs: [verify-admin, verify-frontend, verify-backend, verify-fileserver, verify-shared-ui, verify-shared-http]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pin the Render service to main
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY repo secret is not set}"
          : "${RENDER_SERVICE_ID:?RENDER_SERVICE_ID repo secret is not set}"
          code=$(curl -sS -o "$RUNNER_TEMP/service.json" -w '%{http_code}' \
            -X PATCH "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main","autoDeployTrigger":"off"}')
          echo "PATCH /v1/services/$RENDER_SERVICE_ID -> HTTP $code"
          [ "$code" = "200" ] || { cat "$RUNNER_TEMP/service.json"; exit 1; }
          owner_id=$(jq -r '.ownerId // empty' "$RUNNER_TEMP/service.json")
          [ -n "$owner_id" ] || { echo "::error::Render returned no owner id"; exit 1; }
          echo "RENDER_OWNER_ID=$owner_id" >> "$GITHUB_ENV"
      - name: Trigger the Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY repo secret is not set}"
          : "${RENDER_SERVICE_ID:?RENDER_SERVICE_ID repo secret is not set}"
          code=$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"clear\",\"commitId\":\"$GITHUB_SHA\"}")
          echo "POST /v1/services/$RENDER_SERVICE_ID/deploys -> HTTP $code"
          cat "$RUNNER_TEMP/deploy.json"
          [[ "$code" = "201" || "$code" = "202" ]] || {
            echo "::error::Render refused the deploy trigger (HTTP $code)"
            exit 1
          }
          deploy_id=$(jq -r '.id // empty' "$RUNNER_TEMP/deploy.json")
          [ -n "$deploy_id" ] || { echo "::error::Render returned no deploy id"; exit 1; }
          for attempt in $(seq 1 90); do
            sleep 10
            curl -fsS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              -H "Authorization: Bearer $RENDER_API_KEY" > "$RUNNER_TEMP/deploy-status.json"
            status=$(jq -r '.status' "$RUNNER_TEMP/deploy-status.json")
            echo "Render deploy $deploy_id: $status ($attempt/90)"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ended with $status"
                curl -fsS -G "https://api.render.com/v1/logs" \
                  -H "Authorization: Bearer $RENDER_API_KEY" \
                  --data-urlencode "ownerId=$RENDER_OWNER_ID" \
                  --data-urlencode "resource=$RENDER_SERVICE_ID" \
                  --data-urlencode "type=build" \
                  --data-urlencode "direction=backward" \
                  --data-urlencode "limit=100" > "$RUNNER_TEMP/render-logs.json" || true
                jq -r '.logs // [] | reverse[] | .message' "$RUNNER_TEMP/render-logs.json" || true
                exit 1
                ;;
            esac
          done
          echo "::error::Render deploy did not finish within 15 minutes"
          exit 1
